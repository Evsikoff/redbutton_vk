<!doctype html>
<html>
<head>
    <title>Не нажимать!</title>
	<meta charset="utf-8">
    <meta name="viewport" content="user-scalable=no,width=device-width,initial-scale=1,maximum-scale=1" />
	<link rel="stylesheet" href="css/main.css" />
    <!-- VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body oncontextmenu="return false;">
    <!-- Загрузочный экран -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-button"></div>
            <div class="loading-text">Загрузка...</div>
            <div class="loading-bar">
                <div class="loading-bar-fill"></div>
            </div>
        </div>
    </div>

	<div id="btn-wrap">
        <div id="app-frame">
            <div id="app"></div>
        </div>
    </div>
	<script src="js/main.js"></script>
	<script>
    // Инициализация VK Bridge
    vkBridge.send('VKWebAppInit')
        .then((data) => {
            if (data.result) {
                console.log('VK Bridge initialized');
                // Показываем баннерную рекламу вверху экрана
                vkBridge.send('VKWebAppShowBannerAd', { banner_location: 'top' })
                    .then((data) => {
                        if (data.result) console.log('Баннерная реклама отобразилась');
                    })
                    .catch((error) => {
                        console.log('Ошибка показа баннера:', error);
                    });
            }
        })
        .catch((error) => {
            console.error('Ошибка инициализации VK Bridge', error);
        });

    // Загружаем прогресс и запускаем игру
    loadGameProgress()
        .then(stage => {
            return new Promise(resolve => {
                setTimeout(() => resolve(stage), 2000);
            });
        })
        .then(stage => {
            hideLoadingScreen();

            preloadImage('imgs/red-btn-p.png');
            preloadImage('imgs/green-btn.png');
            preloadImage('imgs/green-btn-p.png');
            preloadImage('imgs/blue-btn.png');
            preloadImage('imgs/blue-btn-p.png');

            const urlParams = new URLSearchParams(window.location.search);
            const restartStage = urlParams.get('restart');
            const pendingStage = window.localStorage.pendingStage;
            let finalStage = stage;

            if (restartStage) {
                finalStage = parseInt(restartStage);
            } else if (pendingStage) {
                finalStage = parseInt(pendingStage);
                delete window.localStorage.pendingStage;
                vkBridge.send('VKWebAppStorageSet', {
                    key: 'gameState',
                    value: JSON.stringify({ currentGameStage: finalStage })
                }).catch(function(err) {
                    console.log('Clear pending stage failed:', err);
                });
            }

            var game = new Game({
                clickDelay: 600,
                wrapperSelector: '#app',
                stagesUrl: 'js/stages.json',
                initialStage: finalStage,
            });

            if (restartStage || pendingStage) {
                localStorage.currentGameStage = finalStage;
                vkBridge.send('VKWebAppStorageSet', {
                    key: 'gameState',
                    value: JSON.stringify({ currentGameStage: finalStage })
                }).catch(function(err) {
                    console.log('Save failed:', err);
                });
                if (restartStage) {
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }

            localStorage.bigGamePlayed = true;
        })
        .catch(err => {
            console.error('Initialization error:', err);
            hideLoadingScreen();

            preloadImage('imgs/red-btn-p.png');
            preloadImage('imgs/green-btn.png');
            preloadImage('imgs/green-btn-p.png');
            preloadImage('imgs/blue-btn.png');
            preloadImage('imgs/blue-btn-p.png');

            var game = new Game({
                clickDelay: 600,
                wrapperSelector: '#app',
                stagesUrl: 'js/stages.json',
            });
            localStorage.bigGamePlayed = true;
        });

    // Функция загрузки прогресса (сначала VK Storage, потом localStorage)
    async function loadGameProgress() {
        let localStage = +window.localStorage.currentGameStage || 0;

        try {
            const data = await vkBridge.send('VKWebAppStorageGet', { keys: ['gameState'] });
            if (data.keys) {
                const stateStr = data.keys.find(k => k.key === 'gameState')?.value;
                if (stateStr) {
                    const progressObj = JSON.parse(stateStr);
                    if (progressObj && typeof progressObj.currentGameStage !== 'undefined') {
                        const cloudStage = progressObj.currentGameStage;
                        console.log('VK Storage save loaded, stage:', cloudStage);
                        if (progressObj.pendingStage !== undefined && progressObj.pendingStage !== null) {
                            window.localStorage.pendingStage = progressObj.pendingStage;
                            console.log('Pending stage loaded:', progressObj.pendingStage);
                        }
                        window.localStorage.currentGameStage = cloudStage;
                        return cloudStage;
                    }
                }
            }
        } catch (err) {
            console.log('Could not load VK Storage save:', err);
        }

        console.log('Using localStorage, stage:', localStage);
        return localStage;
    }

    // Функция скрытия загрузочного экрана
    function hideLoadingScreen() {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
            loadingScreen.classList.add('hidden');
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 500);
        }
    }
</script>
<script>
    // Предотвращение pull-to-refresh и скролла
    document.addEventListener('touchmove', function(e) {
        e.preventDefault();
    }, { passive: false });

    // Блокировка контекстного меню
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    });
</script>
</body>
</html>
